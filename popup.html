<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Handdy Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 360px;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.45);
    }
    .logo-text h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .logo-text p {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Master Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 25px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider-toggle {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #334155;
      transition: 0.2s;
      border-radius: 999px;
    }
    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 19px;
      width: 19px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider-toggle {
      background: linear-gradient(135deg, #10b981, #06b6d4);
    }
    input:checked + .slider-toggle:before {
      transform: translateX(21px);
    }

    /* Quick Action Buttons */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.12s ease;
    }
    .btn:hover {
      background: #334155;
      transform: translateY(-1px);
    }
    .btn-primary {
      grid-column: span 2;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border: none;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3);
    }
    .btn-primary:hover {
      opacity: 0.95;
    }

    /* Settings Card */
    .card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
    }
    .control-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .control-val {
      color: #38bdf8;
      font-weight: 700;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #06b6d4;
      cursor: pointer;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #e2e8f0;
      padding: 2px 0;
    }
    .toggle-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #06b6d4;
      cursor: pointer;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }
    .link-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }
    .link-btn:hover {
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <div class="logo-icon">🖐️</div>
      <div class="logo-text">
        <h1>Handdy</h1>
        <p>Shortcut: Alt + Shift + H</p>
      </div>
    </div>
    <label class="switch" title="Enable/Disable Hand Gesture Control">
      <input type="checkbox" id="enabledToggle" checked />
      <span class="slider-toggle"></span>
    </label>
  </div>

  <div class="action-grid">
    <button id="openSidePanelBtn" class="btn btn-primary">
      <span>◧</span>
      <span>Open Persistent Side Panel (Best for Tab Switching)</span>
    </button>
    <button id="openSandboxBtn" class="btn">
      <span>🧪</span>
      <span>Practice Sandbox</span>
    </button>
    <button id="grantCamBtn" class="btn">
      <span>📷</span>
      <span>Camera Setup</span>
    </button>
  </div>

  <div class="card">
    <div class="card-title">Pointer &amp; Gesture Tuning</div>

    <div class="control-row">
      <div class="control-label">
        <span>Cursor Sensitivity</span>
        <span id="sensitivityVal" class="control-val">1.35x</span>
      </div>
      <input type="range" id="sensitivity" min="0.7" max="2.3" step="0.05" value="1.35" />
    </div>

    <div class="control-row">
      <div class="control-label">
        <span>Cursor Smoothing (1-Euro Filter)</span>
        <span id="smoothingVal" class="control-val">65%</span>
      </div>
      <input type="range" id="smoothing" min="0.1" max="0.95" step="0.05" value="0.65" />
    </div>

    <div class="control-row">
      <div class="control-label">
        <span>Scroll Speed</span>
        <span id="scrollSpeedVal" class="control-val">1.25x</span>
      </div>
      <input type="range" id="scrollSpeed" min="0.4" max="2.5" step="0.05" value="1.25" />
    </div>

    <div class="control-row">
      <div class="control-label">
        <span>Pinch Click Sensitivity</span>
        <span id="pinchThresholdVal" class="control-val">0.28</span>
      </div>
      <input type="range" id="pinchThreshold" min="0.18" max="0.38" step="0.01" value="0.28" />
    </div>
  </div>

  <div class="card">
    <div class="card-title">Smart Features</div>

    <label class="toggle-row">
      <span>Magnetic Snap to Buttons &amp; Links</span>
      <input type="checkbox" id="magneticSnap" checked />
    </label>

    <label class="toggle-row">
      <span>Dwell Auto-Click (Hover 1s to Click)</span>
      <input type="checkbox" id="dwellClick" />
    </label>

    <label class="toggle-row">
      <span>Show Mini Camera HUD on Webpages</span>
      <input type="checkbox" id="showCameraHud" checked />
    </label>

    <label class="toggle-row">
      <span>Draw 21-Point Hand Skeleton</span>
      <input type="checkbox" id="showSkeleton" checked />
    </label>

    <label class="toggle-row">
      <span>Invert Scroll Direction</span>
      <input type="checkbox" id="invertScroll" />
    </label>
  </div>

  <div class="footer">
    <span>100% Local On-Device AI</span>
    <button id="resetBtn" class="link-btn">Reset Defaults</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
